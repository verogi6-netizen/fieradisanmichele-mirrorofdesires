<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiera San Michele - Lo Specchio</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font elegante da Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- Libreria per scaricare l'immagine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <!-- Header con Titolo -->
  <header class="header">
    <h1>Fiera San Michele</h1>
  </header>

  <!-- Container Principale -->
  <main class="main-content">
    
    <!-- Scheda dello Specchio -->
    <div class="mirror-card" id="card-da-scaricare">
      <div class="mirror-header">
        <span class="sparkle">✨</span>
        <h2>Lo Specchio Magico</h2>
        <span class="sparkle">✨</span>
      </div>
      
      <p class="subtitle">Oggi lo specchio pensa che...</p>
      
      <!-- Box della frase casuale -->
      <div class="phrase-box">
        <p id="frase">Caricamento in corso...</p>
      </div>

      <!-- Tag Instagram (visibile SOLO nell'immagine scaricata) -->
      <div class="instagram-handle" id="ig-handle">
        @fiera_san_michele_barcon
      </div>

      <!-- Pulsanti visibili sul sito -->
      <div class="actions" id="actions-box">
        <button class="btn btn-refresh" onclick="generaNuovaFrase()">🔄 Scopri un'altra frase</button>
        <button class="btn btn-download" onclick="scaricaImmagineStoria()">📸 Scarica per le Storie</button>
      </div>
    </div>

  </main>

  <script>
    const frasi = [
      "Riconosco subito una vera baddie",
      "Multa per eccesso di bellezza",
      "Voto outfit: 10+",
      "Ehi scusa ti ho lasciato gli occhi addosso, mi aiuteresti a ritrovarli?",
      "C'è il Wi-Fi qui? Perché sento una connessione pazzesca tra noi",
      "Ma ti chiami Alice? Una come te può venire solo dal paese delle meraviglie",
      "Non ti dimenticherò facilmente",
      "Non è il caldo ma sei tu che alzi la temperatura",
      "Sei più piccante della 'nduja calabrese",
      "Per caso sei nato il 10 ottobre? Perché sei un 10/10",
      "Se fossi Raoul Bova ti direi che hai degli occhi spaccanti",
      "Mi chiedevo se avessi un cuore in più perché tu hai appena rubato il mio",
      "Spero che tu conosca il primo soccorso perché mi hai tolto il fiato",
      "Ma ti chiami Maya? Perché sei la fine del mondo"
    ];

    function generaNuovaFrase() {
      const indiceCasuale = Math.floor(Math.random() * frasi.length);
      const elementoFrase = document.getElementById("frase");
      
      elementoFrase.style.opacity = 0;
      setTimeout(() => {
        elementoFrase.innerText = `"${frasi[indiceCasuale]}"`;
        elementoFrase.style.opacity = 1;
      }, 200);
    }

    function scaricaImmagineStoria() {
      const card = document.getElementById("card-da-scaricare");
      const actionsBox = document.getElementById("actions-box");
      const igHandle = document.getElementById("ig-handle");

      // 1. Applica le modifiche grafiche al DOM
      actionsBox.style.setProperty("display", "none", "important");
      igHandle.style.setProperty("display", "block", "important");

      // 2. Aspetta 100ms per dare il tempo al browser di ridisegnare la pagina prima dello screenshot
      setTimeout(() => {
        html2canvas(card, { 
          scale: 3, 
          backgroundColor: null,
          useCORS: true
        }).then(canvas => {
          canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            link.href = url;
            link.download = 'specchio-fiera-san-michele.png';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => URL.revokeObjectURL(url), 100);

            // 3. Ripristina i pulsanti a schermo
            actionsBox.style.display = "flex";
            igHandle.style.display = "none";
          }, 'image/png');
        }).catch(err => {
          actionsBox.style.display = "flex";
          igHandle.style.display = "none";
        });
      }, 100);
    }

    window.onload = generaNuovaFrase;
  </script>
</body>
</html>
